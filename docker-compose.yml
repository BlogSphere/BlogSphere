services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blog-sphere-app
    ports:
      - "${APP_PORT:-5001}:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI:-mongodb://db:27017/blog-sphere}
      - JWT_SECRET=${JWT_SECRET:-blog_sphere_super_secret_jwt_token_key_2026_987654321}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - NODE_ENV=production
    depends_on:
      - db
    restart: always

  db:
    image: mongo:6.0
    container_name: blog-sphere-db
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  mongo_data:
    driver: local


